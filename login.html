<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Server Dashboard</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #2c2c2c;
      --text: #e0e0e0;
      --text-bright: #ffffff;
      --text-muted: #888888;
      --accent: #ff3333; /* matching primary color */
      --accent-hover: #ff5555;
      --input-bg: #181818;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      margin-bottom: 30px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--text-bright);
      font-family: var(--font-sans);
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 51, 51, 0.2);
    }

    .remember-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      color: var(--text-muted);
    }

    .remember-group input {
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      background-color: var(--accent);
      color: var(--text-bright);
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .login-btn:hover {
      background-color: var(--accent-hover);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .error-banner {
      background-color: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.2);
      color: #ffcccc;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Dashboard Login</h1>
      <p>Enter your credentials to access the panel</p>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <label class="remember-group">
        <input type="checkbox" id="remember">
        Remember me on this device
      </label>

      <button type="submit" class="login-btn">Log In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBanner = document.getElementById('error-banner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, remember })
        });

        const data = await res.json();
        if (data.success) {
          // Success! Reload the window. The server will now recognize the session cookie
          // and serve index.html instead of login.html.
          window.location.reload();
        } else {
          errorBanner.textContent = data.error || 'Invalid credentials';
          errorBanner.style.display = 'block';
        }
      } catch (err) {
        errorBanner.textContent = 'Server request failed: ' + err.message;
        errorBanner.style.display = 'block';
      }
    });
  </script>
</body>
</html>
