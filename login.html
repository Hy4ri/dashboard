<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <title>Login - Server Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --bg: #080808;
      --card-bg: rgba(16, 16, 18, 0.42);
      --card-border: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e0e0e0;
      --text-bright: #ffffff;
      --text-muted: #9e9e9e;
      --accent: #990000;
      --accent-hover: #cc3333;
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(14px);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse at 30% 20%, rgba(60,20,20,0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(20,20,60,0.1) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 600px 600px at 20% 30%, rgba(180,30,30,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 75% 20%, rgba(40,60,160,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 50% 70%, rgba(120,20,80,0.08) 0%, transparent 70%);
      animation: meshFloat 25s ease-in-out infinite alternate;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes meshFloat {
      0%   { transform: translate(0, 0) rotate(0deg); }
      33%  { transform: translate(30px, -20px) rotate(1deg); }
      66%  { transform: translate(-20px, 15px) rotate(-0.5deg); }
      100% { transform: translate(10px, -10px) rotate(0.5deg); }
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 80px rgba(204,0,0,0.04);
    }

    .login-header { margin-bottom: 30px; text-align: center; }
    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
    }
    .login-header p { font-size: 14px; color: var(--text-muted); }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-bright);
      font-family: var(--font-sans);
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(204, 0, 0, 0.2);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.2); }

    .remember-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      color: var(--text-muted);
    }
    .remember-group input { cursor: pointer; }

    .login-btn {
      width: 100%;
      background: var(--accent);
      color: var(--text-bright);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .login-btn:hover { background: var(--accent-hover); }
    .login-btn:active { transform: scale(0.98); }

    .error-banner {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.2);
      color: #ffcccc;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px rgba(16,16,18,0.9) inset !important;
      -webkit-text-fill-color: var(--text-bright) !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>Dashboard Login</h1>
      <p>Enter your credentials to access the panel</p>
    </div>
    <div class="error-banner" id="error-banner"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <label class="remember-group">
        <input type="checkbox" id="remember">
        Remember me on this device
      </label>
      <button type="submit" class="login-btn">Log In</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorBanner = document.getElementById('error-banner');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember })
        });
        const data = await res.json();
        if (data.success) {
          window.location.reload();
        } else {
          errorBanner.textContent = data.error || 'Invalid credentials';
          errorBanner.style.display = 'block';
        }
      } catch (err) {
        errorBanner.textContent = 'Server request failed: ' + err.message;
        errorBanner.style.display = 'block';
      }
    });
  </script>
</body>
</html>
