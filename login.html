<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <title>Login - Server Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --bg: #121212;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --text: #e4e4e7;
      --text-bright: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #6aa0f0;
      --accent-hover: #8ab4f8;
      --on-accent: #0b1220;
      --crit: #ef5350;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    :focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-header { margin-bottom: 30px; text-align: center; }
    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
    }
    .login-header p { font-size: 14px; color: var(--text-muted); }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      min-height: 44px;
      background: #222222;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 12px 16px;
      color: var(--text-bright);
      font-family: var(--font-sans);
      font-size: 14px;
    }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(106, 160, 240, 0.3); }
    .form-control::placeholder { color: var(--text-muted); }

    .remember-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      color: var(--text-muted);
      min-height: 44px;
    }
    .remember-group input { cursor: pointer; width: 18px; height: 18px; }

    .login-btn {
      width: 100%;
      min-height: 44px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 4px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { background: var(--accent-hover); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-banner {
      background: rgba(239, 83, 80, 0.14);
      border: 1px solid var(--crit);
      color: var(--text-bright);
      border-radius: 4px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #222222 inset !important;
      -webkit-text-fill-color: var(--text-bright) !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>Dashboard Login</h1>
      <p>Enter your credentials to access the panel</p>
    </div>
    <div class="error-banner" id="error-banner"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <label class="remember-group">
        <input type="checkbox" id="remember">
        Remember me on this device
      </label>
      <button type="submit" class="login-btn">Log In</button>
    </form>
  </div>
  <script src="/login.js" defer></script>
</body>
</html>
