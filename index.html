<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Server Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23990000'%3E%3Cpath d='M4 3h16a2 2 0 012 2v14a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2zm0 16h16V5H4v14zm2-8h4v6H6v-6zm6-4h4v10h-4V7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <a href="#cpu-card" class="skip-link">Skip to content</a>

  <header>
    <div class="header-left">
      <h1>Dashboard</h1>
      <button id="logout-btn" class="logout-btn" style="display: none" aria-label="Log Out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Logout</span>
      </button>
    </div>
    <div class="service-bar" id="service-bar" role="group" aria-label="Service links"></div>
    <div class="status-bar">
      <span id="header-battery" class="header-battery" style="display:none">
        <span class="battery-icon" aria-hidden="true"><span id="bat-fill" class="battery-fill" style="width:0%"></span></span>
        <span id="bat-header-val" aria-label="Not available">—</span>
      </span>
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span class="sr-only" id="status-text" role="status">Connecting</span>
      <span id="last-update">Connecting...</span>
    </div>
  </header>

  <main class="grid">

    <!-- PM2 + Torrent row (side by side) -->
    <div class="card-row">

      <!-- PM2 Services -->
      <section class="card" id="pm2-card" role="region" aria-label="Processes" data-accordion data-state="open">
        <div class="card-header">
          <button class="card-header-trigger" aria-expanded="true" data-accordion-trigger>
            Processes
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="pm2-header-actions">
            <button id="restart-all-btn" class="pm2-btn-restart-all" title="Restart all processes">↻ Restart All</button>
          </div>
        </div>
        <div class="card-content">
          <div class="table-wrap" role="group" aria-label="Process list">
            <table>
            <thead>
              <tr>
                <th>Name</th>
                <th class="sortable" data-sort="cpu">CPU</th>
                <th class="sortable" data-sort="memory">Memory</th>
                <th>Actions</th>
              </tr>
            </thead>
              <tbody id="pm2-body" aria-live="polite" aria-atomic="true"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Torrents (side panel) -->
      <section class="card" id="torrent-card" role="region" aria-label="Active Downloads" data-accordion data-state="open">
        <button class="card-header" aria-expanded="true" data-accordion-trigger>
          Active Downloads <span id="torrent-count" class="torrent-count"></span>
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </button>
        <div class="card-content">
          <div id="torrent-list" aria-live="polite"></div>
        </div>
      </section>

    </div><!-- /card-row -->

    <!-- CPU (all-in-one block) -->
    <section class="card" id="cpu-card" role="region" aria-label="CPU usage" data-accordion data-state="open">
      <button class="card-header" aria-expanded="true" data-accordion-trigger>
        CPU
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </button>
      <div class="card-content">
        <div id="cpu-overall" aria-live="polite">
          <div class="bar-wrap">
            <div class="bar-fill cpu" id="cpu-bar-fill" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            <div class="bar-label">
              <span>Overall</span>
              <span id="cpu-pct" aria-label="Not available">—</span>
            </div>
          </div>
        </div>

        <div id="cpu-cores" class="core-grid" aria-live="polite"></div>

        <div class="grid-2">
          <div>
            <h3>Load</h3>
            <div id="load-rows" aria-live="polite">
              <div class="info-row"><span class="key">1 min</span><span class="val" id="load-1" aria-label="Not available">—</span></div>
              <div class="info-row"><span class="key">5 min</span><span class="val" id="load-5" aria-label="Not available">—</span></div>
              <div class="info-row"><span class="key">15 min</span><span class="val" id="load-15" aria-label="Not available">—</span></div>
            </div>
            <div id="cpu-sparkline-container" class="sparkline-container"></div>
          </div>
          <div>
            <h3>Temperatures</h3>
            <div id="thermal-grid" class="thermal-grid" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Memory & Swap (merged) -->
    <section class="card" id="mem-card" role="region" aria-label="Memory and Swap usage" data-accordion data-state="open">
      <button class="card-header" aria-expanded="true" data-accordion-trigger>
        Memory
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </button>
      <div class="card-content">
        <h3>Physical Memory</h3>
        <div id="mem-bar" aria-live="polite">
          <div class="bar-wrap">
            <div class="bar-fill memory" id="mem-bar-fill" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            <div class="bar-label">
              <span>Used</span>
              <span id="mem-pct" aria-label="Not available">—</span>
            </div>
          </div>
        </div>
        <div id="mem-rows" aria-live="polite">
          <div class="info-row"><span class="key">Available</span><span class="val val-green" id="mem-avail" aria-label="Not available">—</span></div>
          <div class="info-row"><span class="key">Free</span><span class="val" id="mem-free" aria-label="Not available">—</span></div>
          <div class="info-row"><span class="key">Buffers</span><span class="val" id="mem-buffers" aria-label="Not available">—</span></div>
          <div class="info-row"><span class="key">Cached</span><span class="val" id="mem-cached" aria-label="Not available">—</span></div>
        </div>

        <h3>Swap Space</h3>
        <div id="swap-bar" aria-live="polite">
          <div class="bar-wrap">
            <div class="bar-fill swap" id="swap-bar-fill" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            <div class="bar-label">
              <span>Used</span>
              <span id="swap-pct" aria-label="Not available">—</span>
            </div>
          </div>
        </div>
        <div id="swap-rows" aria-live="polite">
          <div class="info-row"><span class="key">Free</span><span class="val val-green" id="swap-free" aria-label="Not available">—</span></div>
        </div>
      </div>
    </section>

    <!-- Disk -->
    <section class="card" id="disk-card" role="region" aria-label="Disk usage" data-accordion data-state="open">
      <button class="card-header" aria-expanded="true" data-accordion-trigger>
        Disk
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </button>
      <div class="card-content">
        <div id="disk-bar" aria-live="polite">
          <div class="bar-wrap">
            <div class="bar-fill disk" id="disk-bar-fill" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            <div class="bar-label">
              <span id="disk-used-label" aria-label="Not available">—</span>
              <span id="disk-pct" aria-label="Not available">—</span>
            </div>
          </div>
        </div>
        <div id="disk-rows" aria-live="polite">
          <div class="info-row"><span class="key">Total</span><span class="val" id="disk-total" aria-label="Not available">—</span></div>
          <div class="info-row"><span class="key">Used</span><span class="val" id="disk-used" aria-label="Not available">—</span></div>
          <div class="info-row"><span class="key">Available</span><span class="val val-green" id="disk-avail" aria-label="Not available">—</span></div>
        </div>
      </div>
    </section>

    <!-- Network -->
    <section class="card" id="net-card" role="region" aria-label="Network traffic" data-accordion data-state="open">
      <button class="card-header" aria-expanded="true" data-accordion-trigger>
        Network
        <span class="net-rate" id="net-rate-indicator" style="display:none">
          <span class="net-rate-down">↓ —</span>
          <span class="net-rate-up">↑ —</span>
        </span>
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </button>
      <div class="card-content">
        <div id="net-connectivity" class="connectivity-row" aria-live="polite">
          <div class="connectivity-item">
            <span class="connectivity-label">Internet</span>
            <span class="connectivity-status" id="net-internet-status">—</span>
          </div>
          <div class="connectivity-item">
            <span class="connectivity-label">Technitium DNS</span>
            <span class="connectivity-status" id="net-dns-status">—</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Web Terminal -->
    <section class="card" id="terminal-card" role="region" aria-label="Terminal" data-accordion data-state="open">
      <div class="card-header">
        <button class="card-header-trigger" aria-expanded="true" data-accordion-trigger>
          Terminal
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </button>
        <button class="terminal-fullscreen-btn" id="terminal-fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
          <svg class="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
      </div>
      <div class="card-content">
        <div class="terminal-status" id="terminal-status">Click to connect</div>
        <div id="terminal-container"></div>
      </div>
    </section>

  </main>

  <noscript>
    <div style="text-align:center; padding:2rem; color:#ff4d4d; font-family:monospace;">
      <p>JavaScript is required for this dashboard. Please enable JavaScript.</p>
    </div>
  </noscript>
  <script type="module" src="/js/main.js"></script>
  <link rel="stylesheet" href="/js/vendor/xterm.min.css">
  <script src="/js/vendor/xterm.min.js"></script>
  <script src="/js/vendor/addon-fit.min.js"></script>
</body>
</html>
